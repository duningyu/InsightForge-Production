[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightforge"
version = "3.0.0"
description = "Idea-to-MVP workspace with evidence-aware product decision provenance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "httpx>=0.27,<1",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "mcp>=2.0,<3",
  "keyring>=25,<26",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
llm = ["openai>=2,<3"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: uses disposable local services such as Docker"]

[tool.setuptools.package-data]
app = ["static/*"]
